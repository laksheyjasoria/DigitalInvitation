services:
  postgres:
    image: postgres:16-alpine
    container_name: digital-invitation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_invitation}
      POSTGRES_USER: ${POSTGRES_USER:-digital_invitation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-digital_invitation} -d ${POSTGRES_DB:-digital_invitation}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digital-invitation-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      BACKEND_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-digital_invitation}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-digital_invitation}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8088}
    expose: ["8080"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [app-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digital-invitation-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [app-net]

volumes:
  postgres_data:

networks:
  app-net:
    driver: bridge
