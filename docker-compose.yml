services:
  postgres:
    image: postgres:16-alpine
    container_name: digital-invitation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digital_invitation}
      POSTGRES_USER: ${POSTGRES_USER:-digital_invitation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-digital_invitation} -d ${POSTGRES_DB:-digital_invitation}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digital-invitation-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      BACKEND_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-digital_invitation}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-digital_invitation}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8088}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-digital-invitation}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}
      APP_JWT_ACCESS_TOKEN_MINUTES: ${APP_JWT_ACCESS_TOKEN_MINUTES:-15}
      APP_JWT_REFRESH_TOKEN_DAYS: ${APP_JWT_REFRESH_TOKEN_DAYS:-30}
      APP_REFRESH_COOKIE_SECURE: ${APP_REFRESH_COOKIE_SECURE:-true}
      APP_LOGIN_MAX_ATTEMPTS: ${APP_LOGIN_MAX_ATTEMPTS:-8}
      APP_LOGIN_WINDOW_MINUTES: ${APP_LOGIN_WINDOW_MINUTES:-15}
      APP_LOGIN_BLOCK_MINUTES: ${APP_LOGIN_BLOCK_MINUTES:-15}
      APP_PUBLIC_RSVP_MAX_PER_HOUR: ${APP_PUBLIC_RSVP_MAX_PER_HOUR:-5}
      APP_RAZORPAY_ENABLED: ${APP_RAZORPAY_ENABLED:-false}
      APP_RAZORPAY_KEY_ID: ${APP_RAZORPAY_KEY_ID:-}
      APP_RAZORPAY_KEY_SECRET: ${APP_RAZORPAY_KEY_SECRET:-}
      APP_RAZORPAY_WEBHOOK_SECRET: ${APP_RAZORPAY_WEBHOOK_SECRET:-}
      APP_FILESERVER_ENABLED: ${APP_FILESERVER_ENABLED:-false}
      APP_FILESERVER_BASE_URL: ${APP_FILESERVER_BASE_URL:-}
      APP_FILESERVER_SERVICE_TOKEN: ${APP_FILESERVER_SERVICE_TOKEN:-}
      APP_FILESERVER_UPLOAD_PATH: ${APP_FILESERVER_UPLOAD_PATH:-/master-drive/files}
      APP_FILESERVER_STREAM_PATH: ${APP_FILESERVER_STREAM_PATH:-/master-drive/files/{id}/stream}
      APP_FILESERVER_DELETE_PATH: ${APP_FILESERVER_DELETE_PATH:-/master-drive/files/{id}}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@example.invalid}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    expose: ["8080"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [app-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digital-invitation-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [app-net]

volumes:
  postgres_data:

networks:
  app-net:
    driver: bridge
