name: Platform CI
on:
  push:
    paths: ["backend/**","frontend/**","docker-compose.yml",".github/workflows/backend-ci.yml"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths: ["backend/**","frontend/**","docker-compose.yml",".github/workflows/backend-ci.yml"]
permissions:
  contents: read
concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: digital_invitation
          POSTGRES_USER: digital_invitation
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digital_invitation -d digital_invitation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/digital_invitation
      SPRING_DATASOURCE_USERNAME: digital_invitation
      SPRING_DATASOURCE_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/admin.js
          node --check frontend/invitation.js
          node --check frontend/verify.js
          node --check frontend/forgot.js
          node --check frontend/reset.js
      - name: Verify backend
        working-directory: backend
        run: mvn --batch-mode verify
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
