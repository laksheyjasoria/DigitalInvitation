<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password</title><link rel="stylesheet" href="/app.css"></head><body><header class="top"><a class="brand" href="/">D <span>digital invitation</span></a></header><main class="shell"><section class="panel auth"><p class="eyebrow">ACCOUNT SECURITY</p><h1>Choose a new password.</h1><form id="reset-form"><label>New password<input id="password" type="password" minlength="8" maxlength="72" pattern="(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9\s]).{8,72}" title="Use at least 8 characters with at least one letter, one number and one symbol." required></label><label>Confirm password<input id="confirm" type="password" minlength="8" maxlength="72" required></label><button class="primary">Update password</button></form><p id="message" class="muted"></p><a id="signin" class="primary hidden" href="/app.html">Sign in</a></section></main><script src="/reset.js" defer></script></body></html>
