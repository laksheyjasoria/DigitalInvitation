spring:
  application:
    name: digital-invitation
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  security:
    jwt:
      issuer: ${APP_JWT_ISSUER:digital-invitation}
      secret: ${APP_JWT_SECRET:}
      access-token-minutes: ${APP_JWT_ACCESS_TOKEN_MINUTES:15}
      refresh-token-days: ${APP_JWT_REFRESH_TOKEN_DAYS:30}

  payment:
    razorpay:
      enabled: ${APP_RAZORPAY_ENABLED:false}
      key-id: ${APP_RAZORPAY_KEY_ID:}
      key-secret: ${APP_RAZORPAY_KEY_SECRET:}
      webhook-secret: ${APP_RAZORPAY_WEBHOOK_SECRET:}
  storage:
    fileserver:
      enabled: ${APP_FILESERVER_ENABLED:false}
      base-url: ${APP_FILESERVER_BASE_URL:}
      service-token: ${APP_FILESERVER_SERVICE_TOKEN:}
      upload-path: ${APP_FILESERVER_UPLOAD_PATH:/master-drive/files}
      stream-path: ${APP_FILESERVER_STREAM_PATH:/master-drive/files/{id}/stream}
      delete-path: ${APP_FILESERVER_DELETE_PATH:/master-drive/files/{id}}
  bootstrap:
    admin:
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  invitation:
    expiry:
      cron: ${APP_INVITATION_EXPIRY_CRON:0 */15 * * * *}

  mail:
    from: ${APP_MAIL_FROM:no-reply@example.invalid}
    outbox-delay-ms: ${APP_MAIL_OUTBOX_DELAY_MS:15000}
spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
