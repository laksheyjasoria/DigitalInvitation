spring:
  application:
    name: digital-invitation
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  security:
    jwt:
      issuer: ${APP_JWT_ISSUER:digital-invitation}
      secret: ${APP_JWT_SECRET:}
      access-token-minutes: ${APP_JWT_ACCESS_TOKEN_MINUTES:15}
      refresh-token-days: ${APP_JWT_REFRESH_TOKEN_DAYS:30}
