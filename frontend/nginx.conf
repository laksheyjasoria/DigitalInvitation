limit_req_zone $binary_remote_addr zone=api_rate:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    location = /favicon.ico { return 302 /favicon.svg; }
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.razorpay.com https://checkout.razorpay.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; media-src 'self' blob:" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /i/ {
        rewrite ^/i/[^/]+$ /invitation.html last;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        limit_req zone=api_rate burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend_active/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location /actuator/health {
        proxy_pass http://backend_active/actuator/health;
        access_log off;
    }
}
